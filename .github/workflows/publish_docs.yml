name: 📘 Publish Documentation (Both)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (customer-app)
        run: npm install
        working-directory: ./customer-app

      - name: 📦 Install dependencies (notifications)
        run: npm install
        working-directory: ./notifications

      - name: 🏗️ Generate docs (customer-app)
        run: npx @compodoc/compodoc -p tsconfig.json -d documentation
        working-directory: ./customer-app

      - name: 🏗️ Generate docs (notifications)
        run: npx @compodoc/compodoc -p tsconfig.json -d documentation
        working-directory: ./notifications

      - name: 🧱 Combine documentation folders
        run: |
          mkdir -p documentation
          if [ -d "notifications/documentation" ]; then
            mv notifications/documentation documentation/notifications
          fi
          if [ -d "customer-app/documentation" ]; then
            mv customer-app/documentation documentation/customer-app
          fi

      - name: 🧩 Create index.html
        run: |
          cat > documentation/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <title>Documentación del Proyecto</title>
          </head>
          <body>
              <h1>📘 Documentación</h1>
              <ul>
                  <li><a href="./customer-app/index.html">Customer App</a></li>
                  <li><a href="./notifications/index.html">Notifications</a></li>
              </ul>
          </body>
          </html>
          HTML

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./documentation
